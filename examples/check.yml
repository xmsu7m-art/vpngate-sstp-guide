# VPN Gate Node Check — example workflow with schedule + secret-based worker URL
# Place at: .github/workflows/check.yml
# Two changes vs. the upstream default:
#   1. CHECK_WORKER reads from repo Secret "DOMAIN" instead of a hardcoded URL
#   2. A cron schedule is added (the upstream file has none — cron must be added manually)

name: VPN Gate Node Check

on:
  workflow_dispatch:
  schedule:
    # Every 30 minutes (UTC). Hourly = "0 * * * *", every 2h = "0 */2 * * *"
    - cron: "*/30 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gate-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get VPN Gate nodes + check via Cloudflare Worker + build page
        run: python vpngate.py
        env:
          # Your deployed check Worker, provided via repo Secret DOMAIN
          # Secret value format: https://check-sstp.<your-subdomain>.workers.dev/check?sstp=vpn:vpn@
          CHECK_WORKER: ${{ secrets.DOMAIN }}
          CHECK_CONCURRENCY: "32"
          CHECK_TIMEOUT: "90"

      - name: Ensure GitHub Pages is enabled (one-time auto setup)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          echo "Pages API status: $code"
          if [ "$code" = "404" ]; then
            echo "First run: enabling GitHub Pages (source = GitHub Actions, dir /public)"
            curl -sS -X PUT \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"build_type":"workflow","source":{"branches":["main"],"path":"/public"}}' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/pages"
            echo
            sleep 10
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show site URL
        run: 'echo "site: https://<your-github-username>.github.io/gate/ (deploy outcome: ${{ steps.deployment.outcome }})"'
